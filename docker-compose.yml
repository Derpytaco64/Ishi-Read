services:
  ishi-read:
    build: .
    # CLAUDE-ADDED: x-casaos is CasaOS/ZimaOS's own compose extension, read when importing this
    # file through the App Store's compose-import flow -- only takes effect there, not when running
    # via a plain `docker run`.
    x-casaos:
      icon: https://i.imgur.com/0JRO3A5.gif
    environment:
      - PUID=0
      - PGID=0
      # Remove this if you ever put a TLS-terminating reverse proxy in front of this container --
      # it exists only because this is reached over plain http://<ip>:3000 with nothing encrypting
      # the connection, and browsers silently discard Secure cookies on non-https origins.
      - ISHI_INSECURE_COOKIES=true
      # Lets a reverse proxy running in a different container/host reach the Readium server --
      # it binds to loopback-only by default, which only a process inside this same container can
      # reach. See READIUM_ADDRESS in scripts/run-with-readium.mjs.
      - READIUM_ADDRESS=0.0.0.0
      # Required for books to open at all in a production build. Upstream Thorium Web treats
      # /read/manifest/* (the URL every book on this fork actually links to, see api/books/route.ts)
      # as an experimental route and hard-redirects it to "/" in production (next.config.mjs) unless
      # this is set -- without it, every book click silently bounces back to the library.
      - MANIFEST_ROUTE_FORCE_ENABLE=true
    ports:
      - "3000:3000"
      - "15080:15080"
    volumes:
      # Left side is yours to point wherever you want on this host -- create the
      # directories yourself first (e.g. `mkdir -p ./config ./books` next to this
      # file) so Docker never has to invent a path on its own.
      #
      # Right side must stay exactly as-is: it's where the app itself looks
      # internally -- ./config holds config.json/users.json/settings, ./books is
      # where the Setup wizard's book folder will point by default.
      - ./config:/config
      - ./books:/home/deck/Documents/epubs
    restart: unless-stopped
